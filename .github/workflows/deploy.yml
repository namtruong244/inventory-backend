name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Lambda Architecture (arm64 or amd64)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - amd64

jobs:
  test-and-deploy:
    name: Build & Deploy to AWS Lambda
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Vet & format check
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"

      - name: Run Unit & Integration Tests
        env:
          # Setting INTEGRATION_DB_NAME turns on the PostgreSQL tests in internal/app.
          INTEGRATION_DB_NAME: inventory_it
          INTEGRATION_RUN: ${{ github.run_id }}
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: go test -v ./...

      - name: Build Lambda Bootstrap Binary
        env:
          TARGET_ARCH: ${{ github.event.inputs.architecture || 'arm64' }}
        run: |
          echo "Building Lambda bootstrap binary for architecture: $TARGET_ARCH"
          GOOS=linux GOARCH=$TARGET_ARCH CGO_ENABLED=0 go build -ldflags="-s -w" -o bootstrap ./cmd/lambda
          chmod +x bootstrap
          zip -j deployment.zip bootstrap

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Deploy to AWS Lambda
        run: |
          echo "Deploying deployment.zip to Lambda function: ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}"
          aws lambda update-function-code \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://deployment.zip

      - name: Wait for Lambda Function Update
        run: |
          echo "Waiting for function code update to settle..."
          aws lambda wait function-updated \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}
          echo "Lambda deployment completed successfully!"
